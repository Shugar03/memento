[profile.default]
# w64devkit memory cap: keep parallelism modest (mirrors -j 2 for cargo).
test-threads = 2
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# CredentialStore / AppService mutate process env vars (MEMENTO_TOKEN, etc.)
# and share static locks; these suites must run serially.
filter = 'test(credential) | test(server_refuses) | test(app_service)'
test-threads = 1
