[package]
name = "memento-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Memento RS shared test infrastructure: fakes, temp stores, injectable clock, fixtures."

[features]
default = []
# Windows named-pipe daemon fixtures (DaemonFixture, PipeClientFixture).
daemon = [
    "dep:memento-mcp",
    "dep:memento-application",
    "dep:memento-tenant",
    "dep:memento-parse",
    "dep:memento-cli",
    "dep:interprocess",
]

[dependencies]
memento-domain = { path = "../memento-domain", features = ["testkit"] }
memento-ports = { path = "../memento-ports" }
memento-mcp = { path = "../memento-mcp", optional = true }
memento-application = { path = "../memento-application", optional = true }
memento-tenant = { path = "../memento-tenant", optional = true }
memento-parse = { path = "../memento-parse", optional = true }
memento-cli = { path = "../memento-cli", optional = true }
async-trait.workspace = true
chrono.workspace = true
tempfile.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
rand_core.workspace = true
tracing.workspace = true
interprocess = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
tokio.workspace = true
