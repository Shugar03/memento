[package]
name = "memento-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Memento RS MCP stdio server (rmcp) exposing memory.* and code.* tools."

[dependencies]
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
# daemon transport (daemon-persistent): named pipes + Job Objects + pipe-name
# hashing (REQ-DAEMON-006/003/012).
interprocess.workspace = true
windows.workspace = true
sha2.workspace = true
rand.workspace = true

memento-domain = { path = "../memento-domain" }
memento-ports = { path = "../memento-ports" }
memento-i18n = { path = "../memento-i18n" }
memento-application = { path = "../memento-application" }
memento-tenant = { path = "../memento-tenant" }
memento-parse = { path = "../memento-parse" }
memento-embed-fastembed = { path = "../memento-embed-fastembed" }
# shared stderr tracing subscriber (REQ-OBS-002, design D4).
memento-observability = { path = "../memento-observability" }

[dev-dependencies]
tempfile.workspace = true
memento-testkit = { path = "../memento-testkit" }
memento-okf = { path = "../memento-okf" }

[[bin]]
name = "memento-mcp-server"
path = "src/main.rs"

[[bin]]
name = "memento-daemon"
path = "src/bin/memento-daemon.rs"
