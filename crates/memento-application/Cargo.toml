[package]
name = "memento-application"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Memento RS application use cases: ingest, search, context_fit, feedback, delete, sweep, erase, backup, export, code."

[dependencies]
memento-domain = { path = "../memento-domain" }
memento-ports = { path = "../memento-ports" }
memento-lancedb = { path = "../memento-lancedb" }
memento-parse = { path = "../memento-parse" }
memento-okf = { path = "../memento-okf" }
# Lazy Prometheus metrics recorder + render (REQ-OBS-006/007, design D2):
# AppService::open installs the recorder once when MEMENTO_METRICS=1.
memento-observability = { path = "../memento-observability" }
# metrics 0.24 macros are no-ops without a recorder — hot path = atomic
# increments only when enabled (REQ-OBS-004/006).
metrics.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
sha2.workspace = true
aes-gcm.workspace = true
tar.workspace = true
flate2.workspace = true
rand_core.workspace = true

[dev-dependencies]
tempfile.workspace = true
memento-testkit = { path = "../memento-testkit" }
# span capture in REQ-OBS-003 tests (fmt JSON + FmtSpan::FULL, global default).
tracing-subscriber.workspace = true
